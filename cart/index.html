<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function () {
          const repo = "exam-project-1";
          const base = document.createElement("base");
          base.href = location.hostname.endsWith("github.io") ? `/${repo}/` : "/";
          document.head.appendChild(base);
        })();
      </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store - Cart</title>
    <link rel="stylesheet" href="./css/app.css">
    <script type="module" src="./js/pages/cart-page.js"></script>
</head>
<body>
    <header></header>
    <main class="container stack">
        <h1>Cart</h1>
        <ul id="cart-list" class="stack"></ul>
        <p id="cart-status"></p>
        <div id="cart-summary" class="stack is-hidden">
            <p><strong>Total: <span id="cart-total"></span></strong></p>
            <div class="cluster">
            <button type="button" id="clear-cart" class="btn btn--ghost">Clear cart</button>
            <a href="checkout/index.html" id="checkout-link" class="btn btn--primary">Checkout</a>
            </div>
        </div>
    </main>
    <footer></footer>
</body>
</html>
